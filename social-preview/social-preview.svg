<?xml version="1.0" encoding="UTF-8"?>
<!--
  ghw-demo-repo — social preview image (1280x640, dark theme)
  Alternate, dependency-free source for the PNG. Render with:
      rsvg-convert -w 1280 -h 640 social-preview.svg -o social-preview.png
      # or:  npx svgexport social-preview.svg social-preview.png 1280:640
      # or:  inkscape social-preview.svg -o social-preview.png
  The canonical artifact is social-preview.png produced by make_social_preview.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 V80 M0 80 H80" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background + texture -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- left accent bars -->
  <rect x="0" y="0" width="10" height="640" fill="#58a6ff"/>
  <rect x="10" y="0" width="140" height="640" fill="#141e2e"/>

  <!-- terminal pill -->
  <rect x="90" y="96" width="1100" height="104" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="130" cy="148" r="9" fill="#ff5f56"/>
  <circle cx="164" cy="148" r="9" fill="#ffbd2e"/>
  <circle cx="198" cy="148" r="9" fill="#27c93f"/>
  <text x="252" y="158" font-family="'DejaVu Sans Mono', monospace" font-size="28"
        font-weight="bold" fill="#8b949e">meetr1912@github : ~/ghw-demo-repo</text>
  <text x="1150" y="158" text-anchor="end" font-family="'DejaVu Sans Mono', monospace"
        font-size="28" font-weight="bold" fill="#7ee787">git:(main)</text>

  <!-- title -->
  <text x="90" y="332" font-size="96" font-weight="bold" fill="#e6edf3">ghw-demo-repo</text>

  <!-- subtitle -->
  <text x="92" y="402" font-size="34" fill="#8b949e">A minimal, production-shaped Python starter</text>

  <!-- event line -->
  <text x="92" y="454" font-size="30" font-weight="bold" fill="#58a6ff">MLH Global Hack Week</text>
  <text x="430" y="454" font-size="30" fill="#8b949e">· Hacktoberfest 2026</text>

  <!-- badges (mirror the README) -->
  <g font-size="24" font-weight="bold" text-anchor="middle">
    <rect x="92"  y="508" width="170" height="46" rx="23" fill="#0c2818" stroke="#7ee787" stroke-width="2"/>
    <text x="177" y="540" fill="#7ee787">CI passing</text>
    <rect x="280" y="508" width="185" height="46" rx="23" fill="#22182e" stroke="#d2a8ff" stroke-width="2"/>
    <text x="372" y="540" fill="#d2a8ff">MIT License</text>
    <rect x="483" y="508" width="195" height="46" rx="23" fill="#102036" stroke="#58a6ff" stroke-width="2"/>
    <text x="580" y="540" fill="#58a6ff">Python 3.11+</text>
    <rect x="696" y="508" width="185" height="46" rx="23" fill="#2c1422" stroke="#ff91c8" stroke-width="2"/>
    <text x="788" y="540" fill="#ff91c8">PRs welcome</text>
  </g>

  <!-- handle -->
  <text x="1190" y="597" text-anchor="end" font-family="'DejaVu Sans Mono', monospace"
        font-size="28" fill="#8b949e">github.com/meetr1912/ghw-demo-repo</text>
</svg>
